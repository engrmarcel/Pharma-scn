name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pharma_network_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pharma_network_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pdo_mysql, sodium, zip, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install and build frontend
        run: npm ci && npm run build

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      # phpunit.xml defaults DB_CONNECTION to mariadb for local XAMPP but does not force it,
      # so the job-level DB_* variables (MySQL 8, the production target) take precedence.
      - name: Tests (MySQL 8)
        run: php artisan test

      - name: Dependency audit
        run: composer audit && npm audit --omit=dev
