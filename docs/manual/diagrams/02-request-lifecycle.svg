<rect x="39" y="41" width="160" height="58" rx="10" fill="#0b1f42" stroke="#0b1f42" stroke-width="1.5"/>
<text x="119" y="67" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Client</text>
<text x="119" y="81" font-size="9.5" font-weight="normal" fill="#ffffff" text-anchor="middle">web, app, ERP</text>
<rect x="229" y="41" width="160" height="58" rx="10" fill="#fdf8ec" stroke="#d4951c" stroke-width="1.5"/>
<text x="309" y="67" font-size="11.5" font-weight="bold" fill="#5c3a0a" text-anchor="middle">Authenticate</text>
<text x="309" y="81" font-size="9.5" font-weight="normal" fill="#5c3a0a" text-anchor="middle">token or session</text>
<rect x="419" y="41" width="160" height="58" rx="10" fill="#fdf8ec" stroke="#d4951c" stroke-width="1.5"/>
<text x="499" y="67" font-size="11.5" font-weight="bold" fill="#5c3a0a" text-anchor="middle">Account checks</text>
<text x="499" y="81" font-size="9.5" font-weight="normal" fill="#5c3a0a" text-anchor="middle">active, MFA, device</text>
<rect x="609" y="41" width="160" height="58" rx="10" fill="#fdf8ec" stroke="#d4951c" stroke-width="1.5"/>
<text x="689" y="67" font-size="11.5" font-weight="bold" fill="#5c3a0a" text-anchor="middle">Organization</text>
<text x="689" y="81" font-size="9.5" font-weight="normal" fill="#5c3a0a" text-anchor="middle">X-Organization-Id</text>
<rect x="799" y="41" width="160" height="58" rx="10" fill="#fdf8ec" stroke="#d4951c" stroke-width="1.5"/>
<text x="879" y="67" font-size="11.5" font-weight="bold" fill="#5c3a0a" text-anchor="middle">Module + plan</text>
<text x="879" y="81" font-size="9.5" font-weight="normal" fill="#5c3a0a" text-anchor="middle">enabled, entitled</text>
<rect x="799" y="133" width="160" height="58" rx="10" fill="#fdf8ec" stroke="#d4951c" stroke-width="1.5"/>
<text x="879" y="159" font-size="11.5" font-weight="bold" fill="#5c3a0a" text-anchor="middle">Idempotency</text>
<text x="879" y="173" font-size="9.5" font-weight="normal" fill="#5c3a0a" text-anchor="middle">safe retries</text>
<rect x="609" y="133" width="160" height="58" rx="10" fill="#fdf8ec" stroke="#d4951c" stroke-width="1.5"/>
<text x="689" y="159" font-size="11.5" font-weight="bold" fill="#5c3a0a" text-anchor="middle">Permission</text>
<text x="689" y="173" font-size="9.5" font-weight="normal" fill="#5c3a0a" text-anchor="middle">role + location</text>
<rect x="419" y="133" width="160" height="58" rx="10" fill="#ffffff" stroke="#1f4b8f" stroke-width="1.5"/>
<text x="499" y="159" font-size="11.5" font-weight="bold" fill="#0b1f42" text-anchor="middle">Domain service</text>
<text x="499" y="173" font-size="9.5" font-weight="normal" fill="#0b1f42" text-anchor="middle">one DB transaction</text>
<rect x="229" y="133" width="160" height="58" rx="10" fill="#e8f5ee" stroke="#059669" stroke-width="1.5"/>
<text x="309" y="159" font-size="11.5" font-weight="bold" fill="#064e3b" text-anchor="middle">Records written</text>
<text x="309" y="173" font-size="9.5" font-weight="normal" fill="#064e3b" text-anchor="middle">ledger, audit, trace</text>
<rect x="39" y="133" width="160" height="58" rx="10" fill="#0b1f42" stroke="#0b1f42" stroke-width="1.5"/>
<text x="119" y="159" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">JSON response</text>
<text x="119" y="173" font-size="9.5" font-weight="normal" fill="#ffffff" text-anchor="middle">data or error code</text>
<rect x="419" y="225" width="160" height="58" rx="10" fill="#e8f5ee" stroke="#059669" stroke-width="1.5"/>
<text x="499" y="251" font-size="11.5" font-weight="bold" fill="#064e3b" text-anchor="middle">Outbox event</text>
<text x="499" y="265" font-size="9.5" font-weight="normal" fill="#064e3b" text-anchor="middle">same transaction</text>
<rect x="609" y="225" width="160" height="58" rx="10" fill="#ffffff" stroke="#1f4b8f" stroke-width="1.5"/>
<text x="689" y="251" font-size="11.5" font-weight="bold" fill="#0b1f42" text-anchor="middle">Queue worker</text>
<text x="689" y="265" font-size="9.5" font-weight="normal" fill="#0b1f42" text-anchor="middle">after commit: webhooks</text>
<rect x="24" y="332" width="14" height="14" rx="3" fill="#0b1f42" stroke="#0b1f42"/>
<text x="44" y="343" font-size="10" fill="#334155">Person or system</text>
<rect x="147.6" y="332" width="14" height="14" rx="3" fill="#ffffff" stroke="#1f4b8f"/>
<text x="167.6" y="343" font-size="10" fill="#334155">Platform step</text>
<rect x="254.4" y="332" width="14" height="14" rx="3" fill="#fdf8ec" stroke="#d4951c"/>
<text x="274.4" y="343" font-size="10" fill="#334155">Check or approval</text>
<rect x="383.6" y="332" width="14" height="14" rx="3" fill="#e8f5ee" stroke="#059669"/>
<text x="403.6" y="343" font-size="10" fill="#334155">Record kept</text>
<rect x="479.2" y="332" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#64748b"/>
<text x="499.2" y="343" font-size="10" fill="#334155">Outside the platform</text>
<rect x="625.2" y="332" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48"/>
<text x="645.2" y="343" font-size="10" fill="#334155">Exception</text>
</svg>
